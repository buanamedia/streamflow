<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buana Media - Streamflow Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .server-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media (min-width: 480px) {
            .server-grid {
                flex-direction: row;
            }
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            flex: 1;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 0.875rem;
            margin-bottom: 0;
        }
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Streamflow Server Portal</h1>
        <p>Pilih server STB untuk melanjutkan</p>
        
        <div class="server-grid">
            <!-- Server 1 -->
            <a href="https://stb1.buanamedia.my.id" class="card">
                <h2><span class="status"></span>Server 1 (STB 1)</h2>
                <p>Klik untuk membuka Streamflow Utama</p>
            </a>

            <!-- Server 2 -->
            <a href="https://stb2.buanamedia.my.id" class="card">
                <h2><span class="status"></span>Server 2 (STB 2)</h2>
                <p>Klik untuk membuka Streamflow Cadangan</p>
            </a>
        </div>
    </div>
</body>
</html>
