<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buana Media - Streamflow Portal</title>
    
    <!-- Favicon Streamflow Resmi (SVG) -->
    <link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/bangtutorial/streamflow/main/public/images/logo.svg">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            text-align: center; 
            max-width: 650px; 
            width: 100%; 
        }
        .brand-logo {
            width: 110px;
            height: auto;
            object-fit: contain;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
        }
        .logo { 
            font-size: 2.2rem; 
            font-weight: 800; 
            margin-bottom: 8px; 
            background: linear-gradient(to right, #38bdf8, #818cf8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        p.subtitle { 
            color: #94a3b8; 
            margin-bottom: 35px; 
        }
        .server-grid { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
        }
        @media (min-width: 520px) { 
            .server-grid { 
                grid-template-columns: 1fr 1fr; 
            } 
        }
        .card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            padding: 30px 20px; 
            text-decoration: none; 
            color: inherit; 
            transition: all 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .card:hover { 
            transform: translateY(-8px); 
            border-color: #38bdf8; 
            background: rgba(30, 41, 59, 0.9); 
        }
        .card h2 { 
            font-size: 1.3rem; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .card p { 
            font-size: 0.875rem; 
            color: #94a3b8; 
        }
        
        /* Indikator Online (Hijau) */
        .status-dot { 
            width: 10px; 
            height: 10px; 
            background-color: #22c55e; 
            border-radius: 50%; 
            display: inline-block; 
            box-shadow: 0 0 8px #22c55e; 
        }
        
        /* Indikator Offline (Merah) */
        .status-dot.offline {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .btn-access { 
            margin-top: 18px; 
            padding: 8px 16px; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: 600; 
            border-radius: 8px; 
            font-size: 0.85rem; 
        }

        .btn-access.offline {
            background: #ef4444;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Streamflow Resmi -->
        <img src="https://raw.githubusercontent.com/bangtutorial/streamflow/main/public/images/logo.svg" alt="Streamflow Logo" class="brand-logo">
        
        <div class="logo">Streamflow Portal</div>
        <p class="subtitle">Pilih server Streamflow yang ingin diakses</p>

        <div class="server-grid">
            <!-- Server 1 -->
            <a id="link-s1" href="https://server1.buanamedia.my.id" class="card">
                <h2><span id="dot-s1" class="status-dot"></span> Server 1</h2>
                <p id="desc-s1">Pengecekan Server 1...</p>
                <div id="btn-s1" class="btn-access">Buka Server 1</div>
            </a>

            <!-- Server 2 -->
            <a id="link-s2" href="https://server2.buanamedia.my.id" class="card">
                <h2><span id="dot-s2" class="status-dot"></span> Server 2</h2>
                <p id="desc-s2">Pengecekan Server 2...</p>
                <div id="btn-s2" class="btn-access">Buka Server 2</div>
            </a>
        </div>
    </div>

    <script>
        function checkServer(domainUrl, dotId, descId, btnId, linkId, serverName) {
            const img = new Image();
            let isResolved = false;

            // Timeout pengecekan 3 detik
            const timer = setTimeout(() => {
                if (!isResolved) {
                    isResolved = true;
                    setOffline();
                }
            }, 3000);

            // Jika favicon server berhasil dimuat = Online
            img.onload = () => {
                if (!isResolved) {
                    isResolved = true;
                    clearTimeout(timer);
                    document.getElementById(descId).innerText = `${serverName} Streamflow (Online)`;
                }
            };

            // Jika gagal dimuat (Error 1033 / Mati) = Offline
            img.onerror = () => {
                if (!isResolved) {
                    isResolved = true;
                    clearTimeout(timer);
                    setOffline();
                }
            };

            // Panggil favicon server secara langsung
            img.src = `${domainUrl}/favicon.ico?v=${Math.random()}`;

            function setOffline() {
                document.getElementById(dotId).classList.add('offline');
                document.getElementById(descId).innerText = "Server Maintenance / Offline";
                document.getElementById(btnId).classList.add('offline');
                document.getElementById(btnId).innerText = "Lihat Status";
                document.getElementById(linkId).href = `maintenance.html?server=${encodeURIComponent(serverName)}`;
            }
        }

        // Jalankan pengecekan
        checkServer('https://server1.buanamedia.my.id', 'dot-s1', 'desc-s1', 'btn-s1', 'link-s1', 'Server 1');
        checkServer('https://server2.buanamedia.my.id', 'dot-s2', 'desc-s2', 'btn-s2', 'link-s2', 'Server 2');
    </script>
</body>
</html>
